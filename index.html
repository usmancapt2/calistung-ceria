const SESSION_SIZE=15;

// Rotasi soal disimpan di localStorage. Setiap kali level dimainkan,
// soal berikutnya diambil dari antrean sampai seluruh bank soal selesai,
// baru kemudian antrean diacak lagi. Dengan demikian soal tidak berulang
// sebelum seluruh soal pada level tersebut muncul.
function sess(t,L){
 const make={baca,tulis,hitung}[t];
 const all=make(L);
 if(t==='tulis'){
   // Tulis tetap mencakup seluruh materi + 4 soal penguatan acak.
   const extra=shuf(all).slice(0,Math.min(4,all.length));
   return all.concat(extra);
 }

 const key='cal.rotation.'+t+'.'+L.id;
 let r=null;
 try{r=JSON.parse(localStorage.getItem(key)||'null')}catch(e){r=null}

 // Jika bank soal berubah atau data rotasi belum ada, buat antrean baru.
 if(!r || !Array.isArray(r.order) || r.order.length!==all.length ||
    r.order.some(i=>!Number.isInteger(i)||i<0||i>=all.length) ||
    !Number.isInteger(r.pos) || r.pos<0 || r.pos>=all.length+1){
   r={order:shuf(all.map((_,i)=>i)),pos:0};
 }

 const out=[];
 // Ambil maksimal 15 soal. Jika sampai ujung bank soal, lanjutkan ke
 // siklus baru yang diacak; soal dari siklus baru hanya dipakai bila
 // diperlukan untuk memenuhi 15 soal sesi berikutnya.
 while(out.length<Math.min(SESSION_SIZE,all.length)){
   if(r.pos>=r.order.length){
     r.order=shuf(all.map((_,i)=>i));
     r.pos=0;
   }
   const take=Math.min(SESSION_SIZE-out.length,r.order.length-r.pos);
   for(let j=0;j<take;j++) out.push(all[r.order[r.pos++]]);
 }
 try{localStorage.setItem(key,JSON.stringify(r))}catch(e){}
 return out;
}

function layout(keys,side){
